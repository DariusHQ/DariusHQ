name: Update top repositories

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    paths:
      - 'scripts/top-repositories/**'
      - '.github/workflows/top-repositories.yml'

permissions:
  contents: write

concurrency:
  group: top-repositories-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and update card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/top-repositories/render.test.mjs
          node scripts/top-repositories/update.test.mjs
          node scripts/top-repositories/update.mjs
      - name: Commit changed statistics
        run: |
          git add assets/top-repositories.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update top repositories card"
          git push
